<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Diagnóstico</title>
<style>body{font-family:monospace;padding:20px;background:#000;color:#0f0;font-size:14px;line-height:1.6}pre{background:#111;padding:10px;border:1px solid #0f0;overflow:auto;white-space:pre-wrap}</style>
</head><body>
<h2>🔍 DIAGNÓSTICO</h2>
<pre id="out">Cargando...</pre>
<script>
var log=[];
function say(t){log.push(t);}
say("✅ JavaScript CORRE");

window.onerror=function(m,s,l,c,e){
  say("❌ ERROR: "+m+" | línea "+l+":"+c);
  say("   "+(e&&e.stack?e.stack.split("\n")[0]:""));
};

say("--- Comprobaciones básicas ---");
say("navigator.userAgent: "+navigator.userAgent.slice(0,60));
say("mediaDevices: "+(navigator.mediaDevices?"✅":"❌"));
say("geolocation: "+(navigator.geolocation?"✅":"❌"));
say("fetch: "+(window.fetch?"✅":"❌"));

setTimeout(function(){
  say("\n--- Elementos de la página ---");
  var ids=['btn-tab-curp','btn-tab-datos','panel-curp','panel-datos','btnBuscar','btnCurp','curp','nombre','cp','lada','telefono'];
  ids.forEach(function(id){
    var el=document.getElementById(id);
    say((el?"✅ ":"❌ ")+id+(el&&el.onclick?" [onclick OK]":" [SIN onclick]"));
  });

  say("\n--- Functions ---");
  say("cambiarTab: "+(typeof cambiarTab));
  say("leerForm: "+(typeof leerForm));
  say("enviar: "+(typeof enviar));
  say("ejecutarFlujo: "+(typeof ejecutarFlujo));

  say("\n--- Test onclick ---");
  try{
    if(typeof cambiarTab==="function"){
      say("Llamando cambiarTab('datos')...");
      cambiarTab('datos');
      var pd=document.getElementById('panel-datos');
      say("panel-datos visible: "+(pd&&!pd.classList.contains('panel-oculto')?"✅ SÍ":"❌ NO"));
    }
  }catch(e){say("❌ cambiarTab error: "+e.message);}

  document.getElementById('out').textContent=log.join("\n");
},500);
</script>
</body></html>
